services:
  - type: web
    name: pgmate-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: RAZORPAY_KEY_ID
        value: rzp_test_pgmate_demo
      - key: RAZORPAY_KEY_SECRET
        value: rzp_test_secret_pgmate_demo
